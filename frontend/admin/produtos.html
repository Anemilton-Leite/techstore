<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos | TechStore Admin</title><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body"><aside class="admin-sidebar" id="admin-sidebar"><div class="admin-logo"><a href="../index.html">TECH<span>STORE</span></a></div><nav class="admin-nav"><a href="./dashboard.html" class="admin-nav-link">▦ Dashboard</a><a href="./produtos.html" class="admin-nav-link is-active">▣ Produtos</a><a href="./categorias.html" class="admin-nav-link">▤ Categorias</a><a href="./pedidos.html" class="admin-nav-link">▧ Pedidos</a></nav><div class="admin-sidebar-footer"><a href="../index.html" class="admin-nav-link">↩ Voltar à loja</a><button type="button" class="admin-nav-link" id="admin-logout">↪ Sair</button></div></aside><div class="admin-main"><header class="admin-header"><button type="button" class="admin-menu-button" id="admin-menu-button">☰</button><div><span class="admin-header-label">CATÁLOGO</span><h1>Produtos</h1></div><button type="button" class="btn btn-primary admin-header-action" id="new-product-button">+ Novo produto</button></header><main class="admin-content"><section class="admin-panel" id="product-form-panel" hidden><div class="admin-panel-header"><div><span class="admin-panel-label">PRODUTO</span><h2 id="product-form-title">Novo produto</h2></div><button type="button" class="admin-close-button" id="close-product-form">×</button></div><form id="product-form"><input type="hidden" id="product-id"><div class="admin-form-grid"><div class="form-field"><label for="product-name">Nome</label><input id="product-name" required minlength="2"></div><div class="form-field"><label for="product-category">Categoria</label><select id="product-category" required></select></div><div class="form-field admin-form-full"><label for="product-description">Descrição</label><textarea id="product-description" rows="4" required></textarea></div><div class="form-field"><label for="product-price">Preço</label><input type="number" id="product-price" min="0" step=".01" required></div><div class="form-field"><label for="product-stock">Estoque</label><input type="number" id="product-stock" min="0" step="1" required></div><div class="form-field admin-form-full"><label for="product-image">URL da imagem</label><input id="product-image" placeholder="/assets/images/products/phone.webp"></div></div><div class="admin-form-actions"><button type="button" class="btn btn-outline" id="cancel-product-form">Cancelar</button><button type="submit" class="btn btn-primary">Salvar produto</button></div><p id="product-form-message" class="admin-form-message" role="alert"></p></form></section><section class="admin-panel"><div class="admin-toolbar"><label class="search-box admin-search"><span class="search-icon">⌕</span><input type="search" id="admin-product-search" placeholder="Buscar produtos..."></label><span id="admin-product-count" class="admin-toolbar-count">0 produtos</span></div><div class="admin-table-wrapper"><table class="admin-table"><thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr></thead><tbody id="admin-products-table"></tbody></table></div><div class="admin-mobile-list" id="admin-products-mobile"></div></section><div id="products-feedback" class="admin-feedback" role="alert"></div></main></div><script src="../js/config.js"></script><script type="module" src="../js/admin/admin.js"></script><script type="module" src="../js/admin/produtos.js"></script></body></html>
