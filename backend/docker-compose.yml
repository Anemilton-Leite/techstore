services:
  postgres:
    image: postgres:17-alpine
    container_name: techstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-techstore}
      POSTGRES_USER: ${DB_USER:-techstore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - techstore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - techstore

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techstore-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-techstore}
      DB_USER: ${DB_USER:-techstore}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@techstore.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mercadopago}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:?MERCADOPAGO_ACCESS_TOKEN is required}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:?MERCADOPAGO_WEBHOOK_SECRET is required}
      MERCADOPAGO_NOTIFICATION_URL: ${MERCADOPAGO_NOTIFICATION_URL:?MERCADOPAGO_NOTIFICATION_URL is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://127.0.0.1:5500}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
    ports:
      - "8080:8080"
    networks:
      - techstore

volumes:
  techstore_postgres_data:

networks:
  techstore:
    driver: bridge
