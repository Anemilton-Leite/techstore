<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Crie sua conta na TechStore.">
<title>Criar conta | TechStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-card" aria-labelledby="register-title">
    <a href="../index.html" class="auth-logo">TECH<span>STORE</span></a>
    <h1 id="register-title">Criar sua conta</h1>
    <p class="auth-description">Cadastre-se para acompanhar seus pedidos e agilizar suas compras.</p>
    <form id="register-form" novalidate>
      <div class="form-field">
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" autocomplete="name" minlength="2" required>
      </div>
      <div class="form-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="form-field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary auth-submit" id="register-button">Criar conta</button>
      <p class="form-message" id="register-message" role="alert" aria-live="polite"></p>
    </form>
    <p class="auth-footer">Já possui uma conta? <a href="./login.html">Entrar</a></p>
  </section>
</main>
<script src="../js/config.js"></script><script type="module" src="../js/pages/cadastro.js"></script>
</body>
</html>
