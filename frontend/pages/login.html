<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Entre na sua conta TechStore.">
<title>Entrar | TechStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <a href="../index.html" class="auth-logo">TECH<span>STORE</span></a>
    <h1 id="login-title">Entrar na sua conta</h1>
    <p class="auth-description">Acesse seus pedidos e finalize suas compras com mais rapidez.</p>
    <form id="login-form" novalidate>
      <div class="form-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="form-field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary auth-submit" id="login-button">Entrar</button>
      <p class="form-message" id="login-message" role="alert" aria-live="polite"></p>
    </form>
    <p class="auth-footer">Ainda não possui conta? <a href="./cadastro.html">Criar conta</a></p>
  </section>
</main>
<script src="../js/config.js?v=20260923"></script><script type="module" src="../js/pages/login.js"></script>
</body>
</html>
